name: Refresh market data

on:
  schedule:
    # every 30 minutes during and around US market hours (13:00–21:59 UTC ≈ 9am–5pm ET),
    # then hourly the rest of the time so the dashboard is never badly stale.
    # The third line exists because the first two together left 13:00–21:59 UTC on
    # Sat/Sun with no trigger at all: the weekday line is `1-5`, and the hourly line
    # skips 13–21. Equities don't move then, but the China monitor's router, Ollama and
    # Kalshi feeds ride the same job and were freezing for ~9h every weekend afternoon.
    - cron: "*/30 13-21 * * 1-5"
    - cron: "0 13-21 * * 0,6"
    - cron: "0 0-12,22-23 * * *"
  workflow_dispatch: {}

# let the scheduled job push data commits back to the repo
permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # `if:` expressions cannot read the `secrets` context, which is why these were once
    # job-level env. But job-level env puts the *values* in scope for every step —
    # including the one that executes third-party scraper code and its transitive deps,
    # which would let a malicious release read a production R2 *write* token straight
    # out of the environment. So job level now carries only non-sensitive boolean
    # presence flags for the `if:` conditions; the secret values themselves are set on
    # the individual steps that need them, and nowhere else.
    env:
      HAS_XAI: ${{ secrets.XAI_API_KEY != '' }}
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: omen/package-lock.json

      # Hand the fetcher the *live* baseline, not the git seed.
      #
      # update-market-data.py appends its rolling histories (skew, term, tail, gpu) to
      # whatever omen/market-data.json holds in the checkout. That file is re-committed
      # only when it is over 7 days old – see "Commit refreshed data" below – so without
      # this step every run rebuilds those histories on a week-old baseline and writes
      # back only `baseline + today`, destroying yesterday's point. Found on 2026-08-02:
      # the live skew history ran 07-18..07-27 then jumped straight to 08-02, five days
      # gone, with every cron run green. The carry-on-failure fallbacks degrade the same
      # way – they were resurrecting week-old values instead of the last run's.
      #
      # Best-effort by construction: an R2 miss, a network failure or a corrupt body
      # leaves the committed seed in place, i.e. previous behaviour. seed-market-data.py
      # holds the adopt/refuse rules (and its unit tests).
      - name: Seed fetcher baseline from R2
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 r2 object get "omen-data/market-data.json" \
            --file /tmp/market-data.r2.json --remote \
            || echo "R2 get failed — falling back to the committed seed"
          python3 omen/seed-market-data.py /tmp/market-data.r2.json omen/market-data.json

      - name: Fetch market data + append snapshot + evaluate alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
        run: python3 omen/update-market-data.py --snapshot --alert

      - name: Refresh influencer sentiment (optional; needs XAI_API_KEY)
        # HAS_XAI is the job-level presence flag (a string "true"/"false"); the key
        # itself is injected here only.
        if: ${{ env.HAS_XAI == 'true' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: python3 omen/update-influencers.py

      - name: Fetch Android app charts (best-effort; feeds the consumer-app family)
        # Play has no key-free charts API, so google-play-scraper writes app-charts.json,
        # which update-china-data.py folds into the "apps" signal (iOS it fetches itself).
        # Best-effort: a scraper break must not fail the refresh — the Python step then
        # carries the previous computed value or the manual snapshot.
        #
        # Installs from omen/package-lock.json (`npm ci`) rather than resolving
        # `google-play-scraper@10` fresh at runtime, so the dependency tree is pinned and
        # auditable instead of being whatever the registry serves this half-hour. This
        # step deliberately runs with NO secrets in scope.
        run: |
          cd omen
          npm ci --silent && node update-app-charts.mjs \
            || echo "app-charts fetch failed — china-data will fall back"

      - name: Refresh China AI monitor snapshot data
        # Slow-moving fields for china-ai-monitor.html (leaderboard ranks, GitHub star
        # velocity, OpenRouter weekly share, Vercel gateway share, Ollama pulls, Kalshi
        # odds, fine-tune trees, SDK installs, consumer-app chart presence). The page
        # fetches the fast data live in-browser; this only regenerates china-data.json.
        # Both keys are optional: without ARTIFICIAL_ANALYSIS_API_KEY the AA scores stay
        # a dated snapshot; without CF_RADAR_TOKEN the Radar panel stays hidden.
        #
        # GITHUB_TOKEN is the run's own ephemeral token, not a stored secret. Shared
        # runner IPs exhaust the 60 req/hr unauthenticated limit on api.github.com, and
        # a run where all seven repos failed at once is what poisoned the star-velocity
        # baseline; this raises the ceiling to 1,000/hr. It is in scope only for this
        # step, which runs first-party Python — the step that executes third-party
        # scraper code stays secret-free.
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}
          CF_RADAR_TOKEN: ${{ secrets.CF_RADAR_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 omen/update-china-data.py

      - name: Refresh AI CapEx live tape
        # TSMC monthly revenue (TWSE), EDGAR issuance counts, Ramp AI Index, Anthropic
        # Economic Index freshness, the EIA-860M generator pipeline and Census/BEA
        # capex-vs-GDP -> capex-data.json for ai-capex.html. All keyless: the 860M
        # block used to need EIA_API_KEY and is now read from the published monthly
        # workbook, which also carries the planned and canceled sheets the API lacked.
        run: python3 omen/update-capex-data.py

      # Push the fresh data straight to R2 so the Worker serves it live, with no redeploy.
      # Skips cleanly if the Cloudflare secrets aren't set (the site then falls back to
      # the bundled copy, i.e. previous behaviour).
      - name: Upload data to R2
        if: ${{ env.HAS_CLOUDFLARE == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # A missing optional file (e.g. influencers.json without XAI_API_KEY) must skip,
          # not fail the step — otherwise `bash -e` would kill the run and skip the commit.
          # A real upload failure still propagates and fails the step.
          put() {
            [ -f "omen/$1" ] || { echo "omen/$1 absent — skipping"; return 0; }
            npx --yes wrangler@4 r2 object put "omen-data/$1" --file "omen/$1" --content-type "$2" --remote
          }
          put market-data.json "application/json"
          put snapshots.csv    "text/csv"
          put influencers.json "application/json"
          put capex-data.json  "application/json"
          put china-data.json  "application/json"

      - name: Commit refreshed data
        run: |
          git config user.name "ai-crash-monitor bot"
          git config user.email "actions@github.com"

          # market-data.json is deliberately NOT in the per-run loop below. At 171 KB
          # rewritten in full every 30 minutes it is ~86% of all the data churn here — for
          # a file the site never reads out of git, since worker.js streams it live from
          # R2. It must stay *tracked* all the same: the Worker falls back to the bundled
          # copy on an R2 miss, so a deploy needs a reasonably fresh one. Compromise —
          # re-commit it only when the committed copy is over 7 days old, which is ~1
          # commit/week instead of ~48/day.
          SEED_MAX_AGE=$((7 * 24 * 60 * 60))
          seed_ts=""
          if [ "$(git rev-parse --is-shallow-repository)" = "false" ]; then
            seed_ts="$(git log -1 --format=%ct -- omen/market-data.json)"
          else
            # actions/checkout defaults to fetch-depth: 1, and on a shallow clone
            # `git log -1 --format=%ct -- <path>` reports the grafted tip for every path in
            # its tree — it would claim the seed had just been committed and we would never
            # re-seed. Ask the committed blob directly instead: its own "updated" stamp is
            # exactly the staleness an R2-miss fallback would serve.
            seed_iso="$(git show HEAD:omen/market-data.json 2>/dev/null \
                        | head -c 200 | sed -n 's/.*"updated": *"\([^"]*\)".*/\1/p')"
            if [ -n "$seed_iso" ]; then
              seed_ts="$(date -u -d "$seed_iso" +%s 2>/dev/null || true)"
            fi
          fi
          # an empty seed_ts means never committed (fresh fork) or unparseable — seed it
          if [ ! -f omen/market-data.json ]; then
            echo "market-data.json absent — nothing to seed"
          elif [ -z "$seed_ts" ] || [ "$(( $(date +%s) - seed_ts ))" -ge "$SEED_MAX_AGE" ]; then
            echo "market-data.json seed is stale or never committed — re-seeding this run"
            git add -f omen/market-data.json
          else
            echo "market-data.json seed is $(( ($(date +%s) - seed_ts) / 86400 ))d old — skipping (R2 serves it live)"
          fi

          # Everything else stays a per-run commit: the append-only *-snapshots.csv history,
          # the alert dedup state, and the small JSON files that are bundled-asset-only
          # (china-history, china-snapshots, app-charts) or cheap enough to keep as a warm
          # fallback for an R2 miss (china-data now, like influencers). All 1–10 KB.
          for f in omen/snapshots.csv omen/alert-state.json omen/influencers.json \
                   omen/china-data.json omen/china-history.json omen/china-snapshots.csv \
                   omen/app-charts.json omen/capex-data.json omen/capex-snapshots.csv; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
