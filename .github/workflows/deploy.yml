# Production deploy — this workflow, from main, and nothing else.
#
# Until this existed there was no deploy step in CI at all. Production came from the
# Cloudflare Workers Builds git integration, which built *every branch push*, not just
# main: on 2026-07-30, pushes to fix/china-data-r2 (19:21:22Z) and
# fix/github-star-baseline (19:47:49Z) each reached production ~25-30s later. Whichever
# branch was pushed last was the live site. The 30-minute data cron pushing main is what
# kept dragging it back, which is why the breakage looked intermittent rather than
# constant. Workers Builds must be disconnected when this lands, or the two race and the
# older mechanism silently wins.
#
# Data refreshes deliberately do NOT deploy. refresh.yml commits with the default
# GITHUB_TOKEN, and GitHub does not raise workflow events for GITHUB_TOKEN pushes, so
# this runs on human merges only — roughly once a day instead of ~48 times. That is
# correct, not merely tolerable: all five data files are served live from R2 (worker.js
# DATA_FILES + assets.run_worker_first in wrangler.jsonc), so refreshed data reaches the
# site with no redeploy. The bundled copies are only the R2-miss bootstrap fallback,
# which refresh.yml re-seeds on its own schedule.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Never let two deploys interleave, and never cancel one in flight — a half-applied
  # deploy is worse than a queued one.
  group: deploy
  cancel-in-progress: false

jobs:
  # The same suite test.yml runs, reused rather than copied so the deploy gate cannot
  # drift from the CI gate.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy the Worker
        # No `if:` guard on the secrets here, unlike refresh.yml's upload step. A data
        # upload that skips silently just leaves the site on its previous data; a deploy
        # that skips silently leaves main un-shipped while reporting success, which is
        # the failure this whole workflow exists to prevent. Missing credentials must be
        # a red run.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
