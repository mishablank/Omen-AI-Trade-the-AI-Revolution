# CI gate.
#
# Until this workflow existed, the repo's test suites never ran anywhere: the only
# workflow was refresh.yml (a data cron), so both the Python fetcher tests and the
# three Node suites were only ever run by hand on a developer's machine — a broken
# test could sit green-looking on main indefinitely.
#
# `python3 -m pytest omen/` is the documented single entry point and covers both
# languages: omen/test_regime_explainer.py shells out to the Node suites.
#
# The Python side is linted by ruff (config and rule rationale in ruff.toml at the repo
# root). There is still no bundler and no JS linter, so `node --check` (parse-only) stays
# the pragmatic static gate for the files pytest never loads — the Worker itself and the
# Play-charts fetcher, which would otherwise only fail at deploy/cron time.

name: Tests

on:
  push:
  pull_request:
  # deploy.yml calls this as the gate in front of a production deploy, so the suite
  # is defined once and cannot drift from what CI actually enforces.
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the *caller's* name in a reusable workflow ("Deploy"), which is
  # what keeps the two runs apart. Without it, the push to main and the deploy's gate
  # run would share a group and — with cancel-in-progress — cancel each other, turning
  # a green deploy into a cancelled one at random.
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        # The fetchers and their tests are stdlib-only; pytest and ruff are the only
        # requirements, and ruff is pinned exactly for the same reason the one npm
        # dependency is — a new minor adds rules, and CI going red should mean the code
        # changed, not that the linter did.
        run: pip install pytest ruff==0.16.2

      - name: Lint the Python sources
        # Rule selection and the reasoning behind it live in ruff.toml. Baseline is zero,
        # so any finding here is new.
        run: ruff check .

      - name: Syntax-check the Node sources
        # Parse-only check for the JS that pytest never imports: the Worker entrypoint
        # and the Play-charts fetcher. The test-*.mjs files are checked too so a syntax
        # error in a suite is reported as such rather than as a suite failure.
        run: |
          node --check worker.js
          node --check ci-branch-guard.mjs
          node --check omen/update-app-charts.mjs
          for f in omen/test-*.mjs; do
            node --check "$f"
          done

      - name: Run tests
        # Covers the Python fetcher tests and, via test_regime_explainer.py, the
        # Node suites (test-regime-explainer, test-pure-helpers, test-verdict).
        run: python3 -m pytest omen/ -v
